receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
  
  # Usar debug exporter en lugar del logging deprecado
  debug:
    verbosity: detailed
  
  # File exporter para que Promtail pueda leer los logs
  file/logs:
    path: /tmp/otel-logs.json
    format: json

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]