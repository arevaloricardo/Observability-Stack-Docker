receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
  
  # Usar logging exporter para enviar logs como JSON a stdout
  # Luego Loki puede recoger estos logs usando promtail o docker logs
  logging:
    loglevel: info
  
  # Alternativamente, podemos usar file exporter
  file/logs:
    path: /tmp/otel-logs.json

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, file/logs]