server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Configuración para logs del OpenTelemetry Collector (archivo JSON)
  - job_name: otel-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: otel-logs
          service_name: otel-collector
          __path__: /tmp/otel-logs.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service_name: resource_logs[0].resource.attributes[0].value.string_value
            trace_id: resource_logs[0].scope_logs[0].log_records[0].trace_id
      - labels:
          level:
          service_name:
          trace_id:
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - output:
          source: message

  # Configuración para logs de Docker containers
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output
