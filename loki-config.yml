auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Configuración para recibir datos de OpenTelemetry
distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 5MB

# Habilitar receptor OTLP
otlp:
  protocols:
    grpc:
      endpoint: 0.0.0.0:9095
    http:
      endpoint: 0.0.0.0:3100